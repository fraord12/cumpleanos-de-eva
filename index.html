<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galería de fotografía</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#121212;--card:#1E1E1E;--tx:#F2EEE8;--mut:#CFC8BE;--gold:#E0B25C;--line:#3A3A3A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 96px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{font-family:'Playfair Display',serif;font-size:22px;font-weight:700}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:999px;padding:10px 20px;border:1px solid var(--tx);background:transparent;color:var(--tx)}
button.gold{background:var(--gold);color:#121212;border-color:var(--gold);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.hero{position:relative;border-radius:32px;overflow:hidden;min-height:380px;display:flex;align-items:flex-end;background:#2A2724 center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:rgba(10,10,10,.55)}
.hero .in{position:relative;padding:36px;max-width:760px}
h1{font-family:'Playfair Display',serif;font-size:clamp(32px,6vw,60px);line-height:1.08;margin:0 0 12px}
.sub{font-size:18px;color:var(--mut);margin:0}
h3{font-family:'Playfair Display',serif;font-size:24px;margin:0;padding:16px 18px 2px}
.cnt{padding:0 18px 6px;color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:28px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.evgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:32px}
.card{background:var(--card);border-radius:24px;overflow:hidden;position:relative}
.card.sel{outline:3px solid var(--gold)}
.card img{display:block;width:100%;height:260px;object-fit:cover;cursor:zoom-in}
.ecov{display:block;width:100%;height:300px;border:0;border-radius:0;padding:0;background:#2A2724 center/cover no-repeat}
.chk{position:absolute;top:12px;left:12px;width:44px;height:44px;border-radius:50%;background:rgba(18,18,18,.75);border:2px solid var(--tx);padding:0;font-size:20px}
.sel .chk{background:var(--gold);color:#121212;border-color:var(--gold)}
.tools{padding:10px 14px 14px}
.empty{color:var(--mut);padding:24px;border:1px solid var(--line);border-radius:24px;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--gold);color:#121212;font-weight:600;border-radius:999px;padding:12px 22px;display:none;z-index:20;max-width:90vw;text-align:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:10}
#lb img{max-width:100%;max-height:78vh;border-radius:20px}
</style></head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lb"><img id="lbi" alt=""><div style="display:flex;gap:10px"><button class="gold" id="lbd">Descargar</button><button id="lbx">Cerrar</button></div></div>
<script>
const $=s=>document.querySelector(s);
let G=null,view=null,sel=new Set(),lbp=null;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(t,fn,c){const b=el('button',c||'',t);b.onclick=fn;return b}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',4000)}
const u=p=>encodeURI(p),fname=p=>decodeURIComponent(p.file.split('/').pop());
const safe=s=>(s||'fotos').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
function saveUrl(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.append(a);a.click();a.remove()}
const one=p=>saveUrl(u(p.file),fname(p));
async function zip(list,name){if(!list.length)return;if(!window.JSZip){toast('No se pudo preparar el archivo comprimido.');return}
 try{const z=new JSZip();let n=0;for(const p of list){toast('Preparando '+(++n)+' de '+list.length+'…');const r=await fetch(u(p.file));if(!r.ok)throw 0;z.file(fname(p),await r.blob())}
 const out=await z.generateAsync({type:'blob'}),h=URL.createObjectURL(out);saveUrl(h,safe(name)+'.zip');setTimeout(()=>URL.revokeObjectURL(h),8000);$('#toast').style.display='none'}
 catch(e){toast('No se pudo preparar la descarga. Prueba con menos fotos.')}}
function route(){const m=location.hash.match(/^#e-(\d+)$/);view=m&&G.events[+m[1]]?+m[1]:null;sel.clear();render()}
const go=i=>{location.hash=i==null?'inicio':'e-'+i};
function render(){const app=$('#app');app.textContent='';document.title=G.name;
 const nav=el('nav');nav.append(el('div','brand',G.name));if(view!=null)nav.append(btn('← Todos los eventos',()=>go(null)));app.append(nav);
 const ev=G.events[view],hero=el('section','hero'),hi=el('div','in');
 if(ev&&ev.cover)hero.style.backgroundImage='url("'+u(ev.cover)+'")';
 hi.append(el('h1','',ev?ev.title:G.head),el('p','sub',ev?'Toca las fotos que te gusten y descárgalas en su calidad original.':G.sub));hero.append(hi);app.append(hero);
 if(!ev){if(!G.events.length){app.append(el('div','empty','Pronto verás tus fotos aquí.'));return}
  const g=el('div','grid evgrid');G.events.forEach((e,i)=>{const d=el('div','card'),cv=el('button','ecov');cv.setAttribute('aria-label','Abrir '+e.title);if(e.cover)cv.style.backgroundImage='url("'+u(e.cover)+'")';cv.onclick=()=>go(i);
   d.append(cv,el('h3','',e.title),el('div','cnt',e.photos.length+(e.photos.length===1?' foto':' fotos')));const t=el('div','tools');t.append(btn('Ver fotos',()=>go(i),'gold'));d.append(t);g.append(d)});app.append(g);return}
 const mine=ev.photos.filter(p=>sel.has(p.file)),all=mine.length===ev.photos.length,tl=el('div','row'),ds=btn('Descargar selección ('+mine.length+')',()=>zip(mine,ev.title+'-seleccion'),'gold');ds.disabled=!mine.length;
 tl.append(btn(all?'Quitar selección':'Seleccionar todas',()=>{ev.photos.forEach(p=>all?sel.delete(p.file):sel.add(p.file));render()}),ds,btn('Descargar todas',()=>zip(ev.photos,ev.title)));app.append(tl);
 const g=el('div','grid');if(!ev.photos.length)g.append(el('div','empty','Este evento aún no tiene fotos.'));
 ev.photos.forEach(p=>{const d=el('div','card'+(sel.has(p.file)?' sel':'')),im=document.createElement('img');im.src=u(p.thumb||p.file);im.loading='lazy';im.alt='Foto de '+ev.title;
  im.onclick=()=>{lbp=p;$('#lbi').src=u(p.file);$('#lb').style.display='flex'};
  const k=btn(sel.has(p.file)?'✓':'',()=>{sel.has(p.file)?sel.delete(p.file):sel.add(p.file);render()},'chk');k.setAttribute('aria-label','Seleccionar foto');
  const t=el('div','tools');t.append(btn('Descargar',()=>one(p)));d.append(im,k,t);g.append(d)});app.append(g)}
const cl=()=>{$('#lb').style.display='none'};$('#lbx').onclick=cl;$('#lb').onclick=e=>{if(e.target.id==='lb')cl()};$('#lbd').onclick=()=>lbp&&one(lbp);document.addEventListener('keydown',e=>{if(e.key==='Escape')cl()});
window.addEventListener('hashchange',()=>{scrollTo(0,0);route()});
fetch('galeria.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{G=j;route()}).catch(()=>{$('#app').append(el('div','empty','No se encontró galeria.json. Ejecuta generar_galeria.py y sube la carpeta completa.'))});
</script></body></html>
